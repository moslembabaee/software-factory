              - revision_id
              - expires_at
              - access_policy
              properties:
                revision_id: *id002
                expires_at:
                  type: string
                  format: date-time
                access_policy: &id005
                  type: string
                  enum:
                  - project_members
                  - explicit_grants
  /previews/{previewId}:
    get:
      operationId: getPreview
      parameters: &id003
      - $ref: '#/components/parameters/PreviewId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
