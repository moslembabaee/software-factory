              schema:
                $ref: '#/components/schemas/ActorCollection'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /actors/{id}:
    get:
      operationId: getActor
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /executions:
    get:
      operationId: listExecutions
      x-phase: 1
      x-query-additional-properties: false
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionCollection'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /executions/{id}/checkpoints:
    get:
      operationId: listAgentCheckpoints
      x-phase: 3
      x-query-additional-properties: false
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      - name: offset
        in: query
        schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
      responses:
        '200':
          description: Checkpoint metadata in sequence order; conversation content is private to workers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, sequence, step, worker_id, fence, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        sequence: { type: integer }
                        step: { type: integer }
                        worker_id: { type: string }
                        fence: { type: integer }
                        created_at: { type: string, format: date-time }
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: *id002
    PreviewId:
      name: previewId
      in: path
      required: true
      schema: *id002
    RevisionId:
      name: id
      in: path
      required: true
      schema: *id002
  schemas:
    Work:
      type: object
      required:
      - id
      - project_id
      - objective
      - state
      - version
      - request_id
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        objective:
          type: string
        state:
          type: string
        version:
          type: integer
        request_id:
          type: string
          format: uuid
    Execution:
      type: object
      required:
      - id
      - work_id
      - state
      - version
      - request_id
      properties:
        id:
          type: string
          format: uuid
        work_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - queued
          - running
          - awaiting_approval
          - verifying
          - needs_reconciliation
          - cancelling
          - completed
          - failed
          - cancelled
          - budget_exhausted
        version:
          type: integer
        request_id:
          type: string
          format: uuid
    TaskExecution:
      type: object
      required: [id, work_id, state, version, request_id, parent_execution_id, created_at]
      properties:
        id: { type: string, format: uuid }
        work_id: { type: string, format: uuid }
        state:
          type: string
          enum: [queued, running, awaiting_approval, verifying, needs_reconciliation, cancelling, completed, failed, cancelled, budget_exhausted]
        version: { type: integer }
        request_id: { type: string, format: uuid }
        parent_execution_id:
          anyOf:
          - { type: string, format: uuid }
          - { type: 'null' }
        created_at: { type: string, format: date-time }
    Event:
      type: object
      required:
      - event_id
      - execution_id
      - sequence
      - type
      - occurred_at
      - payload
      properties:
        event_id:
          type: string
          format: uuid
        execution_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 0
        type:
          type: string
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
    Artifact:
      type: object
      required:
      - id
      - sha256
      - media_type
      properties:
        id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        media_type:
          type: string
    ApiError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - correlation_id
      - retryable
      - safe_action
      properties:
        code:
          type: string
          enum:
          - VALIDATION_FAILED
          - NOT_FOUND
          - FORBIDDEN
          - CONFLICT
          - STALE_REVISION
          - PREVIEW_EXPIRED
          - PREVIEW_NOT_READY
          - REDACTION_BLOCKED
          - ACCEPTANCE_MISMATCH
          - BUDGET_LIMIT
          - UNKNOWN_EXTERNAL_EFFECT
          - RATE_LIMITED
          - INTERNAL_ERROR
        message:
          type: string
        correlation_id: *id002
        retryable:
          type: boolean
        safe_action:
          type: string
        details:
          type: object
    Intake:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - version
      - original_text
      - locale
      - assumptions
      - acceptance_criteria
      - created_at
      properties:
        id: *id002
        project_id: *id002
        version:
          type: integer
          minimum: 1
        original_text:
          type: string
        locale:
          type: string
          enum:
          - fa
          - en
        assumptions:
          type: array
          items:
            type: string
        acceptance_criteria: *id004
        created_at:
          type: string
          format: date-time
    Preview:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - revision_id
      - commit_sha
      - state
      - health
      - expires_at
      - access_policy
      properties:
        id: *id002
        project_id: *id002
        revision_id: *id002
        commit_sha: &id008
          type: string
          pattern: ^[a-f0-9]{40}$
        state:
          type: string
          enum:
          - requested
          - building
          - verifying
          - ready
          - failed
          - expired
          - revoked
        health:
          type: string
          enum:
          - unknown
          - healthy
          - unhealthy
        expires_at:
          type: string
          format: date-time
        access_policy: *id005
        url:
          type:
          - string
          - 'null'
          format: uri
        evidence_digest: *id006
    Feedback:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - preview_id
      - revision_id
      - comment
      - target
      - status
      properties:
        id: *id002
        project_id: *id002
        preview_id: *id002
        revision_id: *id002
        comment:
          type: string
        target: *id007
        screenshot_artifact_id: *id002
        status:
          type: string
          enum:
          - open
          - triaged
          - implemented
          - rejected
    Revision:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - commit_sha
      - evidence_digest
      - created_at
      properties:
        id: *id002
        project_id: *id002
        commit_sha: *id008
        evidence_digest: *id006
        created_at:
          type: string
          format: date-time
        parent_revision_id: *id002
        preview_id: *id002
        summary:
          type: string
    AcceptanceDecision:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - revision_id
      - evidence_digest
      - decision
      - criterion_ids
      - version
      properties:
        id: *id002
        project_id: *id002
        revision_id: *id002
        evidence_digest: *id006
        decision: *id009
        criterion_ids: *id010
        version:
          type: integer
          minimum: 1
    CostForecast:
      type: object
      additionalProperties: false
      required:
      - currency
      - spent
      - reserved
      - authorized_cap
      - estimate_low
      - estimate_high
      - assumptions
      - updated_at
      properties:
        currency:
          type: string
          const: USD
        spent:
          type: number
          minimum: 0
        reserved:
          type: number
          minimum: 0
        authorized_cap:
          type: number
          minimum: 0
        estimate_low:
          type: number
          minimum: 0
        estimate_high:
          type: number
          minimum: 0
        assumptions:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
    DeliveryReceipt:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - revision_id
      - acceptance_decision_id
      - evidence_digest
      - artifact_hashes
      - instructions
      - status
      properties:
        id: *id002
        project_id: *id002
        revision_id: *id002
        acceptance_decision_id: *id002
        evidence_digest: *id006
        artifact_hashes:
          type: array
          minItems: 1
          items: *id006
        instructions:
          type: string
        caveats:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - prepared
          - delivered
          - revoked
    ConsumerStatus:
      type: object
      additionalProperties: false
      required:
      - project_id
      properties:
        project_id: *id002
        feature_statuses:
          type: array
          items:
            type: object
        blockers:
          type: array
          items:
            type: string
        spend:
          $ref: '#/components/schemas/CostForecast'
        active_release:
          oneOf:
          - $ref: '#/components/schemas/Revision'
          - type: 'null'
        latest_verified_preview:
          oneOf:
          - $ref: '#/components/schemas/Preview'
          - type: 'null'
    RevisionList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
        next_cursor:
          type:
          - string
          - 'null'
    RevisionComparison:
      type: object
      additionalProperties: false
      required:
      - left
      - right
      - changed_features
      - evidence
      properties:
        left:
          $ref: '#/components/schemas/Revision'
        right:
          $ref: '#/components/schemas/Revision'
        changed_features:
          type: array
          items:
            type: string
        evidence:
          type: array
          items: *id006
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - phase
        - request_id
      properties:
        status:
          const: ok
        service:
          const: software-factory-api
        phase:
          const: 1
        request_id:
          type: string
          format: uuid
    ProjectCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - request_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        request_id:
          type: string
          format: uuid
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - name
        - request_id
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        request_id:
          type: string
          format: uuid
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: \S
      required:
        - name
      additionalProperties: false
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: \S
      required:
        - name
      additionalProperties: false
      minProperties: 1
    WorkCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - request_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        request_id:
          type: string
          format: uuid
    UpdateWorkRequest:
      type: object
      properties:
        objective:
          type: string
          minLength: 1
          maxLength: 20000
        version:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 9007199254740991
            - type: string
              pattern: ^(0|[1-9][0-9]{0,18})$
      required:
        - objective
        - version
      additionalProperties: false
      minProperties: 1
    ReferenceCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - request_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        request_id:
          type: string
          format: uuid
    Reference:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - kind
        - target_id
        - request_id
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        kind:
          type: string
        target_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
    CreateReferenceRequest:
      type: object
      properties:
        kind:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: \S
        target_id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - kind
        - target_id
      additionalProperties: false
    UpdateReferenceRequest:
      type: object
      properties:
        kind:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: \S
        target_id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      additionalProperties: false
      minProperties: 1
    RelationCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - request_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        request_id:
          type: string
          format: uuid
    Relation:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - kind
        - from_ref
        - to_ref
        - request_id
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        kind:
          type: string
        from_ref:
          type: string
          format: uuid
        to_ref:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
    CreateRelationRequest:
      type: object
      properties:
        from_ref:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        to_ref:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        kind:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: \S
      required:
        - from_ref
        - to_ref
        - kind
      additionalProperties: false
    UpdateRelationRequest:
      type: object
      properties:
        from_ref:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        to_ref:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        kind:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: \S
      additionalProperties: false
      minProperties: 1
    ActorCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - request_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
        request_id:
          type: string
          format: uuid
    Actor:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - subject
        - request_id
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        subject:
          type: string
        request_id:
          type: string
          format: uuid
    ExecutionCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - request_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Execution'
        request_id:
          type: string
          format: uuid
  responses:
    Conflict:
      description: Version or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Invalid:
      description: Invalid request schema
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found or inaccessible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationFailed:
      description: ValidationFailed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Stale:
      description: Stale
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Expired:
      description: Expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RedactionBlocked:
      description: RedactionBlocked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BudgetLimit:
      description: BudgetLimit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnknownEffect:
      description: UnknownEffect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
