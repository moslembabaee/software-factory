        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - revision_id
              - evidence_digest
              - decision
              - criterion_ids
              - expected_version
              properties:
                revision_id: *id002
                evidence_digest: &id006
                  type: string
                  pattern: ^[a-f0-9]{64}$
                decision: &id009
                  type: string
                  enum:
                  - accepted
                  - rejected
                criterion_ids: &id010
                  type: array
                  minItems: 1
                  items: *id002
                expected_version:
                  type: integer
                  minimum: 0
  /health:
    get:
      operationId: getHealth
      x-phase: 1
      servers:
        - url: /
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
