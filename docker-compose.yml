services:
  postgres:
    image: postgres:16-alpine
    container_name: software-factory-postgres
    environment:
      POSTGRES_DB: software_factory
      POSTGRES_USER: sf
      POSTGRES_PASSWORD: sf_dev_pw
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sf -d software_factory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: