# Operations marked x-phase: 1 or 3 are implemented and covered by tests/contract.
# Unmarked approval and consumer operations describe later implementation phases.
openapi: 3.1.0
info:
  title: Software Factory API
  version: '6.5'
  description: Normative core and consumer API v6.4. Full non-consumer capability
    families remain governed by capability inventory.
servers:
- url: /api/v1
security:
- bearerAuth: []
paths:
  /works:
    post:
      operationId: createWork
      x-phase: 1
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - project_id
              - objective
              properties:
                project_id:
                  type: string
                  format: uuid
                objective:
                  type: string
                  minLength: 1
                  maxLength: 20000
      responses:
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
    get:
      operationId: listWorks
      x-phase: 1
      x-query-additional-properties: false
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkCollection'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /works/{id}:
    get:
      operationId: getWork
      x-phase: 1
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: Work
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateWork
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: deleteWork
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /works/{id}/executions:
    get:
      operationId: listTaskExecutions
      x-phase: 3
      x-query-additional-properties: false
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      - name: offset
        in: query
        schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
      responses:
        '200':
          description: Execution attempts in creation order, including recovery lineage
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskExecution'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createExecution
      x-phase: 1
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - base_sha
              - budget_cap_usd
              properties:
                base_sha:
                  type: string
                  pattern: ^[a-fA-F0-9]{40}$
                budget_cap_usd:
                  type: number
                  minimum: 0
                  maximum: 100000
                parent_execution_id:
                  type: string
                  format: uuid
      responses:
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '409':
          $ref: '#/components/responses/Conflict'
  /executions/{id}:
    get:
      operationId: getExecution
      x-phase: 1
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: Execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          $ref: '#/components/responses/NotFound'
  /executions/{id}/events:
    get:
      operationId: listEvents
      x-phase: 1
      parameters:
      - $ref: '#/components/parameters/Id'
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /executions/{id}/cancel:
    post:
      operationId: cancelExecution
      x-phase: 1
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '202':
          description: Cancellation requested
        '409':
          $ref: '#/components/responses/Conflict'
  /executions/{id}/artifacts:
    get:
      operationId: listArtifacts
      x-phase: 1
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: Artifacts
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artifact'
  /approvals/{id}/decisions:
    post:
      operationId: decideApproval
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - decision
              - action_digest
              - expected_version
              properties:
                decision:
                  type: string
                  enum:
                  - approved
                  - denied
                action_digest:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                expected_version:
                  type: integer
                  minimum: 0
                reason:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Decision accepted
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/intake:
    post:
      operationId: createIntake
      parameters: &id001
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intake'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - original_text
              - locale
              - assumptions
              - acceptance_criteria
              properties:
                original_text:
                  type: string
                  minLength: 1
                  maxLength: 20000
                locale:
                  type: string
                  enum:
                  - fa
                  - en
                assumptions:
                  type: array
                  items:
                    type: string
                acceptance_criteria: &id004
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - description
                    properties:
                      id: &id002
                        type: string
                        format: uuid
                      description:
                        type: string
  /projects/{projectId}/consumer-status:
    get:
      operationId: getConsumerStatus
      parameters: *id001
      responses:
        '200':
          description: ConsumerStatus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
  /projects/{projectId}/previews:
