  /previews/{previewId}/feedback:
    post:
      operationId: createFeedback
      parameters: *id003
      responses:
        '201':
          description: Feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - comment
              - target
              properties:
                comment:
                  type: string
                  minLength: 1
                  maxLength: 10000
                target: &id007
                  type: object
                  additionalProperties: false
                  required:
                  - viewport_width
                  - viewport_height
                  properties:
                    selector:
                      type: string
                    x:
                      type: number
                      minimum: 0
                    y:
                      type: number
                      minimum: 0
                    viewport_width:
                      type: integer
                      minimum: 1
                    viewport_height:
                      type: integer
                      minimum: 1
                screenshot_artifact_id: *id002
  /projects/{projectId}/revisions:
    get:
      operationId: listRevisions
      parameters: *id001
      responses:
        '200':
          description: RevisionList
