services:
  web:
    build: .
    container_name: software-factory_web
    restart: unless-stopped
    environment:
      PORT: "3003"
      API_DATABASE_URL: ${API_DATABASE_URL:-postgres://sf:sf_dev_pw@postgres:5432/software_factory}
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/health', { signal: AbortSignal.timeout(4000) }).then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: software_factory
      POSTGRES_USER: sf
      POSTGRES_PASSWORD: sf_dev_pw
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sf -d software_factory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
